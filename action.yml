name: "setup-atopile"
description: "Setup atopile CLI"
branding:
  icon: "package"
  color: "orange"

inputs:
  ato-config:
    description: "Path to ato.yaml config, based on which to determine the version to run"
    required: false
    default: ""
  version:
    description: "A specific version of atopile to use"
    required: false
    default: ""
  docker-tag:
    description: "A Docker image tag to pull (e.g., 'feature-fabll_part2', 'pr-123', 'sha-abc1234'). Overrides version/ato-config."
    required: false
    default: ""
  working-directory:
    description: "Working directory where to look for ato.yaml config"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    # Only setup UV when we need to resolve version from ato.yaml / PyPI
    - uses: astral-sh/setup-uv@v5
      if: ${{ !inputs.docker-tag && !inputs.version }}
      with:
        enable-cache: false
        pyproject-file: "${{ github.action_path }}/pyproject.toml"

    - name: Determine atopile version
      id: determine-version
      shell: bash
      run: |
        if [ -n "$DOCKER_TAG" ]; then
          echo "version=$DOCKER_TAG" >> "$GITHUB_OUTPUT"
          # docker-tag is typically a mutable ref (branch, PR, SHA) — don't cache
          echo "cacheable=false" >> "$GITHUB_OUTPUT"
        elif [ -n "$SPECIFIED_VERSION" ]; then
          echo "version=$SPECIFIED_VERSION" >> "$GITHUB_OUTPUT"
          echo "cacheable=true" >> "$GITHUB_OUTPUT"
        else
          uv run --project "${{ github.action_path }}" --directory "${{ inputs.working-directory }}" python "${{ github.action_path }}/main.py" >> "$GITHUB_OUTPUT"
          # Version resolved from PyPI is always a specific immutable release
          echo "cacheable=true" >> "$GITHUB_OUTPUT"
        fi
      env:
        DOCKER_TAG: ${{ inputs.docker-tag }}
        ATO_CONFIG: ${{ inputs.ato-config }}
        SPECIFIED_VERSION: ${{ inputs.version }}

    # Cache Docker image for immutable version tags (saves ~30s+ pull time)
    - name: Cache Docker image
      id: docker-cache
      if: ${{ steps.determine-version.outputs.cacheable == 'true' }}
      uses: actions/cache@v4
      with:
        path: /tmp/atopile-docker.tar
        key: docker-atopile-kicad-${{ steps.determine-version.outputs.version }}

    - name: Load cached Docker image
      if: ${{ steps.docker-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: docker load -i /tmp/atopile-docker.tar

    - name: Pull Docker image
      if: ${{ steps.docker-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: docker pull "ghcr.io/atopile/atopile-kicad:${{ steps.determine-version.outputs.version }}"

    - name: Save Docker image to cache
      if: ${{ steps.docker-cache.outputs.cache-hit != 'true' && steps.determine-version.outputs.cacheable == 'true' }}
      shell: bash
      run: docker save -o /tmp/atopile-docker.tar "ghcr.io/atopile/atopile-kicad:${{ steps.determine-version.outputs.version }}"

    - name: Tag atopile container
      run: >
        docker tag
        "ghcr.io/atopile/atopile-kicad:${{ steps.determine-version.outputs.version }}"
        "atopile-local"
      shell: bash

    - name: Install alias
      run: echo "${{ github.action_path }}/bin" >> $GITHUB_PATH
      shell: bash